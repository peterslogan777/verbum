<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">VERBUM — emblème : rouleau déployé et monogramme V</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5E6C8"/><stop offset=".35" stop-color="#E6CC7A"/>
      <stop offset=".6" stop-color="#C9A84C"/><stop offset="1" stop-color="#8C7330"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#C9A84C" stop-opacity=".28"/><stop offset="1" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="57" fill="url(#glow)"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#g)" stroke-width="1.6"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#g)" stroke-width=".6" stroke-dasharray="1 3.2" opacity=".8"/>
  <!-- rouleaux (capsules) -->
  <rect x="22" y="33" width="9" height="54" rx="4.5" fill="url(#g)"/>
  <rect x="89" y="33" width="9" height="54" rx="4.5" fill="url(#g)"/>
  <!-- feuille du rouleau -->
  <path d="M33 37 Q60 33 87 37 V83 Q60 87 33 83 Z" fill="#0D1B2A" stroke="url(#g)" stroke-width="1"/>
  <!-- monogramme V -->
  <path d="M43 44 h10 l7 23 l7 -23 h10 l-14.5 33 h-5 z" fill="url(#g)"/>
  <!-- losange de lumière -->
  <path d="M60 22 l3.2 4 -3.2 4 -3.2 -4 z" fill="#E6CC7A"/>
</svg>
